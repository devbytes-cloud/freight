    "options": {
      "systems": [
        "aarch64-darwin",
        "aarch64-linux",
        "x86_64-linux"
      ]
    },
    "build": {
      "freight": {
        "command": "  make conductor-build-binaries\n\n  pkg=github.com/devbytes-cloud/freight/internal/commands\n  version=\"$(git describe --tags --match 'v*' --dirty --always | sed 's/^v//')\"\n  commit=\"$(git rev-parse HEAD)\"\n  date=\"$(TZ=UTC git log -1 --format=%cd --date=format-local:%Y-%m-%dT%H:%M:%SZ)\"\n\n  mkdir -p \"$out/bin\"\n  CGO_ENABLED=0 go build -trimpath \\\n    -ldflags \"-s -w -X $pkg.Version=$version -X $pkg.Commit=$commit -X $pkg.Date=$date\" \\\n    -o \"$out/bin/freight\" ./cmd/freight\n",
        "runtime-packages": [
          "tzdata",
          "iana-etc"
        ],
        "sandbox": "off",
        "version": {
          "command": "git describe --tags --match 'v*' --dirty --always | sed 's/^v//'"
        },
        "description": "Zero-dependency Git hook orchestrator driven by a declarative JSON manifest"
      }
    }
  },
