      "systems": [
        "aarch64-darwin",
        "aarch64-linux",
        "x86_64-linux"
      ]
    },
    "build": {
      "freight": {
        "command": "  goreleaser build --single-target --snapshot --clean\n\n  mkdir -p \"$out/bin\"\n  cp dist/freight_*/freight \"$out/bin/freight\"\n  chmod +x \"$out/bin/freight\"\n",
        "runtime-packages": [
          "tzdata",
          "iana-etc"
        ],
        "sandbox": "off",
        "version": {
          "command": "jq -r '.\".\"' .release-please-manifest.json"
        },
        "description": "Zero-dependency Git hook orchestrator driven by a declarative JSON manifest"
      }
    }
