schema-version = "1.13.0"


[install]
git.pkg-path = "git"
jq.pkg-path = "jq"
gnumake.pkg-path = "gnumake"
goreleaser.pkg-path = "goreleaser"
tzdata.pkg-path = "tzdata"
iana-etc.pkg-path = "iana-etc"
go.pkg-path = "flox/go"
go.pkg-group = "go"
go.version = "1.27.3"


[build]

[build.freight]
sandbox = "off"
description = "Zero-dependency Git hook orchestrator driven by a declarative JSON manifest"
version.command = "jq -r '.\".\"' .release-please-manifest.json"
runtime-packages = ["tzdata", "iana-etc"]
command = '''
  goreleaser build --single-target --snapshot --clean

  mkdir -p "$out/bin"
  cp dist/freight_*/freight "$out/bin/freight"
  chmod +x "$out/bin/freight"
'''

[options]
systems = [
  "aarch64-darwin",
  "aarch64-linux",
  "x86_64-linux",
]
