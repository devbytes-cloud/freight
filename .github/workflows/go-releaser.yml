name: goreleaser

on:
  push:
    tags:
      - "*"

permissions:
  contents: write
  packages: write
jobs:
  goreleaser:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - name: Set up Go
        uses: actions/setup-go@v7
      - name: Install GoReleaser (System-wide)
        uses: goreleaser/goreleaser-action@v7
        with:
          version: latest
          install-only: true
      - name: Run GoReleaser
        uses: goreleaser/goreleaser-action@v7
        with:
          distribution: goreleaser
          version: 'latest'
          args: release --clean
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GORELEASER_AUTH_TOKEN: ${{ secrets.GORELEASER_AUTH_TOKEN}}

  flox-publish:
    needs: goreleaser
    uses: ./.github/workflows/flox-publish.yml
    secrets: inherit
