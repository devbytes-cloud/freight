name: goreleaser

on:
  push:
    tags:
      - "*"

permissions:
  contents: write
  packages: write
jobs:
  goreleaser:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - name: Install Flox
        uses: flox/install-flox-action@5bb9eaaffbeaa699a8251a1ae21ecf4c8e0e37d4 # v2.7.0
      - name: Activate Flox environment
        uses: devbytes-cloud/flox-activate-action@v1
      - name: Run GoReleaser
        run: goreleaser release --clean
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GORELEASER_AUTH_TOKEN: ${{ secrets.GORELEASER_AUTH_TOKEN }}

  flox-publish:
    needs: goreleaser
    uses: ./.github/workflows/flox-publish.yml
    with:
      tag: ${{ github.ref_name }}
    secrets: inherit
