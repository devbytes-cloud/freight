name: Unit tests

on:
  pull_request:   # triggers on every push to a PR

permissions:
  contents: read  # checkout needs this

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install Flox
        uses: flox/install-flox-action@v2

      - name: Activate Flox environment
        uses: devbytes-cloud/flox-activate-action@v1

      - name: Locate Go caches
        id: go-cache
        run: |
          echo "modcache=$(go env GOMODCACHE)" >> "$GITHUB_OUTPUT"
          echo "buildcache=$(go env GOCACHE)" >> "$GITHUB_OUTPUT"

      - name: Cache Go modules and build cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ${{ steps.go-cache.outputs.modcache }}
            ${{ steps.go-cache.outputs.buildcache }}
          key: go-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('go.sum', '.flox/env/manifest.lock') }}
          restore-keys: go-${{ runner.os }}-${{ runner.arch }}-

      - name: make placeholder assets
        run: make asset-placeholders

      - name: Run unit tests with the race detector
        run: make test-go
